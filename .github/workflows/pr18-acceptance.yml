      - working-directory: candidate
        run: python -m pip check
      - name: Provision pinned PostgreSQL18.6 binaries on disposable runner
        id: pg
        working-directory: candidate
        shell: pwsh
        run: ./scripts/prepare-ci-postgres18.ps1
      - name: Full Windows suite, ten lifecycle repetitions and repeated installer
        working-directory: candidate
        shell: pwsh
        run: ../acceptance-harness/acceptance/windows_full.ps1 -PgBin "${{ steps.pg.outputs.pgbin }}"
      - name: Verify explicit projected public artifacts
        if: always()
        id: privacy
        working-directory: candidate
        run: python -c "import sys; from pathlib import Path; sys.path.insert(0,'../acceptance-harness/acceptance'); import run; [run.safe(Path(p)) for p in ['acceptance-public/junit.xml','acceptance-public/provenance.json']]"
      - uses: actions/upload-artifact@v4
