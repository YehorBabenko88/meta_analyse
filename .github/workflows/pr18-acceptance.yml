      - name: Verify exact candidate commit and tree before installation
        working-directory: candidate
        run: python -c "import sys; sys.path.insert(0,'../acceptance-harness/acceptance'); import run; run.verify()"
      - name: Install constrained candidate dependencies
        working-directory: candidate
        run: python -m pip install -c requirements.lock -e '.[test,archive]'
      - working-directory: candidate
        run: python -m pip check
      - name: Confirm pinned disposable PostgreSQL18.1
