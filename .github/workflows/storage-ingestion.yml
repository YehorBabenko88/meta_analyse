name: Storage ingestion integration
on:
  pull_request:
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
      - 'commissioning/**'
      - 'tests/test_adminit_commissioning.py'
      - 'tests/test_host_identity_authorization.py'
  push:
    branches:
      - 'parallel/storage-ingestion'
      - 'audit/**'
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
      - 'commissioning/**'
      - 'tests/test_adminit_commissioning.py'
      - 'tests/test_host_identity_authorization.py'
permissions:
  contents: read
jobs:
  integration:
    if: ${{ !contains(fromJSON('["parallel/adminit-kernel-identity-evidence","parallel/adminit-identity-integration-20261021","parallel/adminit-identity-acceptance-fix-20261022","parallel/adminit-pr20-security-fix-20261022","parallel/adminit-pr21-evidence-schema-20261022","parallel/adminit-pr22-boundary-review-20261022","parallel/adminit-pr23-output-transaction-20261023","maintenance/repository-ci-hygiene-20261023","maintenance/actions-audit-hardening-20261023","maintenance/pr27-content-review-20261023"]'), github.head_ref || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: ingestion_test
          POSTGRES_PASSWORD: ingestion_test_only
          POSTGRES_DB: ingestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      META_ANALYSE_TEST_ADMIN_DSN: postgresql://ingestion_test:ingestion_test_only@127.0.0.1:5432/ingestion_test
      META_ANALYSE_TEST_DSN: postgresql://ingestion_test:ingestion_test_only@127.0.0.1:5432/ingestion_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Actions source SHA
        run: python scripts/record_ci_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e '.[test]'
      - name: Verify exact PostgreSQL18.1 server
        run: python -c "import os,psycopg; c=psycopg.connect(os.environ['META_ANALYSE_TEST_ADMIN_DSN']); assert c.info.server_version==180001; c.close()"
      - name: Validate source syntax
        run: python -m compileall -q src tests
      - name: Run storage unit and PostgreSQL integration tests
        run: python -m pytest -q tests/test_storage_ingestion_unit.py tests/test_storage_ingestion_postgres.py tests/test_flow_history_storage.py --junitxml=storage-tests.xml
      - name: Reject missing, failed or skipped integration evidence
        run: python -c "import xml.etree.ElementTree as E; c=list(E.parse('storage-tests.xml').getroot().iter('testcase')); assert c and all(all(x.find(t) is None for t in ('skipped','error','failure')) for x in c)"
      - name: Project isolated public evidence
        id: privacy_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit storage-tests.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy_gate.outcome == 'success'
        with:
          name: storage-ingestion-exact-source
          if-no-files-found: error
          path: public-evidence/
