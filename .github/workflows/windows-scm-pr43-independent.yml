name: Independent SCM PR43 source-only oracle
on:
  push:
    branches: ['audit/windows-final-acceptance-independent-20261025']
  pull_request:
    paths:
      - 'tests/windows_scm_pr43_independent_unittest.py'
      - '.github/workflows/windows-scm-pr43-independent.yml'
      - 'commissioning/native_scm_diagnostic.py'
      - 'commissioning/process_identity.py'
permissions:
  contents: read
jobs:
  independent-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent source-only unittest
        run: python tests/windows_scm_pr43_independent_unittest.py
