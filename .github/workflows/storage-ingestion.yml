name: Storage ingestion integration
on:
  pull_request:
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
  push:
    branches:
      - 'parallel/storage-ingestion'
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ingestion_test
          POSTGRES_PASSWORD: ingestion_test_only
          POSTGRES_DB: ingestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      META_ANALYSE_TEST_DSN: postgresql://ingestion_test:ingestion_test_only@127.0.0.1:5432/ingestion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate source syntax
        run: python -m compileall -q src tests
      - name: Run storage unit and PostgreSQL integration tests
        run: python -m pytest -q tests/test_storage_ingestion_unit.py tests/test_storage_ingestion_postgres.py tests/test_flow_history_storage.py
