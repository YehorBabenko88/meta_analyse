[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-analyse"
version = "0.1.0"
description = "Read-only market analytics and paper simulation companion for MetaScalp"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "websockets>=13,<16", "psycopg[binary]>=3.2,<4", "PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
meta-analyse = "meta_analyse.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
