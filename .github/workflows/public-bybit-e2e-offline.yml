name: Public Bybit E2E offline contract
on:
  pull_request:
    paths:
      - 'scripts/public_bybit_e2e_probe.py'
      - 'tests/test_public_bybit_e2e_probe.py'
      - 'docs/PUBLIC_BYBIT_E2E_ACCEPTANCE_RU.md'
      - '.github/workflows/public-bybit-e2e-offline.yml'
  push:
    paths:
      - 'scripts/public_bybit_e2e_probe.py'
      - 'tests/test_public_bybit_e2e_probe.py'
      - '.github/workflows/public-bybit-e2e-offline.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,archive]"
      - name: Offline verdict tests (no public network)
        run: python -m pytest -q tests/test_public_bybit_e2e_probe.py --junitxml=public-e2e-offline.xml
      - name: Verify all eight offline cases
        run: python scripts/check_integration_junit.py public-e2e-offline.xml --minimum 8 --require-exact test_false_valid_fails_closed --require-exact test_budget_exhaustion_is_blocked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-e2e-offline-${{ matrix.os }}
          path: public-e2e-offline.xml
          if-no-files-found: error
