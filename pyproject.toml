[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-analyse"
version = "0.1.0"
description = "Read-only market analytics and paper simulation companion for MetaScalp"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "websockets>=13,<16", "psycopg[binary]>=3.2,<4", "PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "hypothesis==6.170.6"]
archive = ["aiohttp>=3.10,<4"]

[project.scripts]
meta-analyse = "meta_analyse.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

# F2 (unified-system#156): TLS/private-key fixture material must never ship in a
# wheel or sdist. Enforced by MANIFEST.in, this exclusion, and
# scripts/check_no_private_key_material.py in CI on the built distributions.
[tool.setuptools.exclude-package-data]
"*" = ["*.key", "*.pem", "*.p12", "*.pfx", "*.csr", "*.srl", "*.der", "*.crt", "*.cer", "*.jks", "*.keystore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning", "error::pytest.PytestUnhandledThreadExceptionWarning"]
