name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONASYNCIODEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[test,archive]"
      - run: python -m pip check
      - name: Mandatory baseline integration suite
        run: python -m pytest -q tests --junitxml=integration-gate.xml
      - name: Verify baseline suite ran without skips
        run: python scripts/check_integration_junit.py integration-gate.xml --minimum 100 --allow-skip test_fifty_connect_disconnect_cycles_drain_collectors --allow-skip test_close_with_twenty_active_instruments_and_pending_db_write --allow-skip test_windows_qt_mock_network_postgres_disconnect_restart --allow-skip test_database_operations_have_bounded_timeouts
      - name: Windows Qt and disposable PostgreSQL integration
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Measure synthetic 20-instrument UI load
        shell: pwsh
        run: python scripts/benchmark_flow_ui.py --seconds 3 --output "$env:RUNNER_TEMP/meta-analyse-ci/ui-performance.json"
      - name: Verify repeated installation
        shell: pwsh
        run: |
          ./install.ps1 -Python (Get-Command python).Source -InstallRoot "$env:RUNNER_TEMP\installer target"
          ./install.ps1 -Python (Get-Command python).Source -InstallRoot "$env:RUNNER_TEMP\installer target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: |
            ${{ runner.temp }}/meta-analyse-ci/repeat-lifecycle/**/tests.*
            ${{ runner.temp }}/meta-analyse-ci/tests.log
            ${{ runner.temp }}/meta-analyse-ci/tests.xml
            ${{ runner.temp }}/meta-analyse-ci/postgresql.log
            ${{ runner.temp }}/meta-analyse-ci/ui-performance.json
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONASYNCIODEBUG: '1'
      META_ANALYSE_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
      META_ANALYSE_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -c requirements.lock -e ".[test,archive]"
      - run: python -m pip check
      - name: Mandatory baseline integration suite
        run: python -m pytest -q tests --junitxml=integration-gate.xml
      - name: Verify baseline suite ran without skips
        run: python scripts/check_integration_junit.py integration-gate.xml --minimum 100 --allow-skip test_failed_pip_install_never_reports_success_or_creates_launcher --require-exact test_resume_and_deduplication --require-exact test_concurrent_sources_same_symbol --require-exact test_conflicting_archive_rolls_back_batch_and_checkpoint --require-exact test_partial_batch_failure_keeps_previous_committed_checkpoint --require-exact test_resume_after_failed_batch_and_repaired_archive_conflict --require-exact test_concurrent_identical_archive_is_idempotent --require-exact test_failed_import_status_preserves_committed_checkpoint --require-exact test_orderflow_reader_returns_exact_aliases --require-exact test_unlock_failure_does_not_mask_original_import_error
      - run: python -m compileall -q src
      - name: Repeat lifecycle resource regressions in fresh processes
        run: python scripts/repeat_lifecycle_tests.py --runs 10 --output-dir repeat-lifecycle
      - name: Linux regressions (preserve pytest failure through tee)
        shell: bash
        run: python -m pytest -q --junitxml=tests.xml | tee tests.log
      - run: python scripts/benchmark_flow_ui.py --seconds 3 --output ui-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-evidence
          path: |
            repeat-lifecycle/**/tests.*
            tests.xml
            tests.log
            ui-performance.json

  archive-contract:
    name: Archive HTTP fault contract (PR 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/archive-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive contract dependencies
        run: python -m pip install -c requirements.lock -e ".[test,archive]"
      - name: Run mandatory HTTP fault contracts
        run: python -m pytest -q tests/test_archive_http_server.py tests/test_archive_resumable_faults.py tests/test_archive_resume_strict_headers.py --junitxml=archive-contract.xml
      - uses: actions/checkout@v4
        with:
          path: integration-gate
          ref: ${{ github.sha }}
      - name: Verify contract coverage and no skips
        run: python integration-gate/scripts/check_integration_junit.py archive-contract.xml --minimum 3 --require test_archive_http_server --require test_archive_resumable_faults --require test_archive_resume_strict_headers
