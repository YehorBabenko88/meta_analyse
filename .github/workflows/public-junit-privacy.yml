name: Public JUnit privacy synthetic
on:
  push:
    branches: ['maintenance/junit-privacy-publication-20261023', 'audit/public-evidence-transaction-20261023', 'audit/adminit-first-integration-20261025', 'integration/final-ci-g0-20261026', 'fix/ui-benchmark-render-samples-20261026', 'audit/pr60-g0-preflight-20261026']
  pull_request:
    paths:
      - 'scripts/check_public_junit.py'
      - 'scripts/project_public_ci_evidence.py'
      - 'tests/test_project_public_ci_evidence.py'
      - 'tests/test_public_evidence_workflows.py'
      - 'tests/test_public_junit.py'
      - '.github/workflows/public-junit-privacy.yml'
permissions:
  contents: read
concurrency:
  group: public-junit-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    if: contains(fromJSON('["maintenance/junit-privacy-publication-20261023","audit/public-evidence-transaction-20261023","audit/adminit-first-integration-20261025","integration/final-ci-g0-20261026","fix/ui-benchmark-render-samples-20261026","audit/pr60-g0-preflight-20261026"]'), github.head_ref || github.ref_name)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock pytest
      - run: python -m pytest --noconftest -q tests/test_public_junit.py tests/test_project_public_ci_evidence.py tests/test_public_evidence_workflows.py --junitxml=public-junit-tests.xml
      - name: Verify tracked source before publication
        id: source_clean
        if: always()
        run: git diff --exit-code HEAD
      - name: Project isolated public evidence
        id: privacy
        if: always() && steps.source_clean.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit public-junit-tests.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: public-junit-${{ matrix.os }}
          if-no-files-found: error
          path: public-evidence/
