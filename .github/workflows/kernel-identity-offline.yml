name: Kernel identity offline
on:
  push:
    branches: ['parallel/adminit-kernel-identity-evidence']
  pull_request:
    paths:
      - 'commissioning/process_identity.py'
      - 'commissioning/process-evidence.ps1'
      - 'tests/test_kernel_identity_evidence.py'
      - '.github/workflows/kernel-identity-offline.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .offline-venv
      - name: Synthetic regressions only (no native collector or database)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.offline-venv/Scripts/python; else PY=.offline-venv/bin/python; fi
          "$PY" -m pip install -c requirements.lock -e '.[test]'
          "$PY" -m pip check
          "$PY" scripts/record_ci_source.py
          "$PY" -m pytest -q tests/test_kernel_identity_evidence.py tests/test_process_inventory_identity.py tests/test_host_identity_authorization.py tests/test_diagnostic_hardening.py -k 'not test_private_evidence_real_dpapi_roundtrip_or_platform_refusal and not test_windows_dpapi_tamper_or_other_platform_fails_closed' --junitxml=kernel-tests.xml
          "$PY" scripts/check_integration_junit.py kernel-tests.xml --minimum 250 --require-exact test_labels_errors_and_subsystem_never_authorize_arbitrary_pid --require-exact test_missing_snapshots_are_not_kernel_evidence --require-exact test_invalid_identity_types_rejected --require-exact test_native_pid_reuse_rejected
