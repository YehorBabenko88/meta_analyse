name: Public JUnit privacy synthetic
on:
  push:
    branches: ['maintenance/junit-privacy-publication-20261023']
  pull_request:
    paths:
      - 'scripts/check_public_junit.py'
      - 'tests/test_public_junit.py'
      - '.github/workflows/public-junit-privacy.yml'
permissions:
  contents: read
concurrency:
  group: public-junit-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    if: (github.head_ref || github.ref_name) == 'maintenance/junit-privacy-publication-20261023'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock pytest
      - run: python -m pytest --noconftest -q tests/test_public_junit.py --junitxml=public-junit-tests.xml
      - name: Project public-only evidence
        id: privacy
        if: always()
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); import project_synthetic_artifacts as p; p.project_junit(Path('public-junit-tests.xml')); p.validate_source(Path('source-sha.json'))"
          python scripts/check_public_diagnostic_artifacts.py public-junit-tests.xml source-sha.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: public-junit-${{ matrix.os }}
          if-no-files-found: error
          path: |
            public-junit-tests.xml
            source-sha.json
