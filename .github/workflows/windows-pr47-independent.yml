name: Windows PR47 independent source-only
on:
  push:
    branches: ['audit/windows-pr47-acceptance-gpt1-20261025']
  pull_request:
    paths:
      - 'tests/windows_pr47_independent_source.py'
      - '.github/workflows/windows-pr47-independent.yml'
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-only independent security checks
        run: python tests/windows_pr47_independent_source.py
