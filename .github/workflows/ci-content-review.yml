name: CI content security synthetic
on:
  push:
    branches: ['maintenance/pr27-content-review-20261023', 'audit/public-evidence-transaction-20261023']
  pull_request:
    paths:
      - 'scripts/verify_ci_audit_artifact_contents.py'
      - 'tests/test_ci_audit_artifact_contents.py'
      - 'tests/test_ci_audit_content_security.py'
      - '.github/workflows/ci-content-review.yml'
permissions:
  contents: read
concurrency:
  group: ci-content-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  content:
    if: contains(fromJSON('["maintenance/pr27-content-review-20261023","audit/public-evidence-transaction-20261023"]'), github.head_ref || github.ref_name)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock pytest
      - name: Original and adversarial content cases only
        run: python -m pytest --noconftest -q tests/test_ci_audit_artifact_contents.py tests/test_ci_audit_content_security.py --junitxml=content-tests.xml
      - name: Project isolated public evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit content-tests.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: content-security-${{ matrix.os }}
          if-no-files-found: error
          path: public-evidence/
