name: Kernel identity offline
on:
  push:
    branches: ['parallel/adminit-kernel-identity-evidence', 'parallel/adminit-identity-integration-20261021']
  pull_request:
    paths:
      - 'commissioning/process_identity.py'
      - 'commissioning/process-evidence.ps1'
      - 'tests/test_kernel_identity_evidence.py'
      - 'tests/test_windows_service_contracts.py'
      - 'tests/test_service_host_fallback.py'
      - '.github/workflows/kernel-identity-offline.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .offline-venv
      - name: Synthetic regressions only (no native collector or database)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.offline-venv/Scripts/python; else PY=.offline-venv/bin/python; fi
          "$PY" -m pip install -c requirements.lock -e '.[test]'
          "$PY" -m pip check
          "$PY" scripts/record_ci_source.py
          "$PY" -m pytest -q tests/test_kernel_identity_evidence.py tests/test_process_inventory_identity.py tests/test_host_identity_authorization.py tests/test_diagnostic_hardening.py tests/test_windows_service_contracts.py tests/test_service_host_fallback.py -k 'not test_private_evidence_real_dpapi_roundtrip_or_platform_refusal and not test_windows_dpapi_tamper_or_other_platform_fails_closed' --junitxml=kernel-tests.xml
          "$PY" scripts/check_integration_junit.py kernel-tests.xml --minimum 533 --require-exact test_scm_requires_explicit_success_error_code --require-exact test_successful_native_image_requires_consistent_success_status --require-exact test_every_contract_requires_each_evidence_source --require-exact test_contract_numeric_identity_types_fail_closed --require-exact test_artifact_gate_rejects_raw_private_payload_without_echo --require-exact test_ordinary_system_image_with_empty_scm_keeps_existing_trust --require-exact test_service_host_cannot_fall_back_to_system_image_with_empty_membership --require-exact test_duplicate_service_membership_is_not_complete_evidence --require-exact test_unproved_or_spoofed_service_implementation_stays_unresolved --require-exact test_combined_lsa_membership_requires_every_implementation --require-exact test_labels_errors_and_subsystem_never_authorize_arbitrary_pid --require-exact test_missing_snapshots_are_not_kernel_evidence --require-exact test_invalid_identity_types_rejected --require-exact test_native_pid_reuse_rejected
      - name: Verify explicit public artifacts before upload
        id: privacy
        if: always()
        run: python scripts/check_public_diagnostic_artifacts.py source-sha.json kernel-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: synthetic-identity-${{ matrix.os }}
          if-no-files-found: error
          path: |
            source-sha.json
            kernel-tests.xml
