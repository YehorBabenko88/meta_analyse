name: Inventory refusal projection synthetic
on:
  push:
    branches: ['parallel/adminit-minimal-refusal-20261025']
  pull_request:
    paths:
      - 'commissioning/host_identity.py'
      - 'tests/test_inventory_refusal_projection.py'
      - '.github/workflows/inventory-refusal-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock pytest
      - name: Synthetic refusal, rare counts and public privacy
        run: python -m pytest --noconftest -q tests/test_inventory_refusal_projection.py tests/test_public_junit.py tests/test_project_public_ci_evidence.py tests/test_public_evidence_workflows.py --junitxml=inventory-refusal-tests.xml
      - name: Reject missing, failed or unexpected skipped cases
        run: python scripts/check_integration_junit.py inventory-refusal-tests.xml --minimum 184 --allow-skip test_symlink_is_rejected --require-exact test_every_existing_allowlisted_rare_reason_count_is_safe --require-exact test_uses_actual_assess_processes_without_reclassifying --require-exact test_existing_stale_pass_is_refused_and_never_republished --require-exact test_child_policy_is_not_forced_or_inherited --require-exact test_ci_is_exact_source_synthetic_without_native_or_pg_jobs
      - name: Project isolated public evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit inventory-refusal-tests.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: inventory-refusal-${{ matrix.os }}
          if-no-files-found: error
          path: public-evidence/
