name: Storage ingestion integration
on:
  pull_request:
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
      - 'commissioning/**'
      - 'tests/test_adminit_commissioning.py'
      - 'tests/test_host_identity_authorization.py'
  push:
    branches:
      - 'parallel/storage-ingestion'
      - 'audit/**'
    paths:
      - 'src/meta_analyse/archive_db_import.py'
      - 'src/meta_analyse/storage_migrations.py'
      - 'src/meta_analyse/flow_history_storage.py'
      - 'src/meta_analyse/desktop_service.py'
      - 'src/meta_analyse/desktop.py'
      - 'tests/test_flow_history_storage.py'
      - 'tests/test_storage_ingestion_*.py'
      - '.github/workflows/storage-ingestion.yml'
      - 'commissioning/**'
      - 'tests/test_adminit_commissioning.py'
      - 'tests/test_host_identity_authorization.py'
permissions:
  contents: read
jobs:
  integration:
    if: ${{ !contains(fromJSON('["test/http-sys-encoding-20261026","fix/http-sys-format-20261026","fix/pr51-hosted-isolation-20261026","integration/adminit-security-readiness-20261025","integration/adminit-final-20261025","parallel/adminit-scm-correlation-20261025","parallel/adminit-r0-r5-liveness-20261025","parallel/adminit-r0-r5-adapter-20261025","parallel/adminit-minimal-refusal-20261025","parallel/adminit-kernel-identity-evidence","parallel/adminit-identity-integration-20261021","parallel/adminit-identity-acceptance-fix-20261022","parallel/adminit-pr20-security-fix-20261022","parallel/adminit-pr21-evidence-schema-20261022","parallel/adminit-pr22-boundary-review-20261022","parallel/adminit-pr23-output-transaction-20261023","maintenance/repository-ci-hygiene-20261023","maintenance/actions-audit-hardening-20261023","maintenance/pr27-content-review-20261023"]'), github.head_ref || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: ingestion_test
          POSTGRES_PASSWORD: ingestion_test_only
          POSTGRES_DB: ingestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      META_ANALYSE_TEST_ADMIN_DSN: postgresql://ingestion_test:ingestion_test_only@127.0.0.1:5432/ingestion_test
      META_ANALYSE_TEST_DSN: postgresql://ingestion_test:ingestion_test_only@127.0.0.1:5432/ingestion_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Actions source SHA
        run: python scripts/record_ci_source.py
      - name: Checkout immutable Math runtime dependency
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/math
          ref: 150910fff08c896f243fdf7e64ec18611420a4d2
          path: .source/math
          persist-credentials: false
      - name: Checkout pinned Terminan paper-only package
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/Terminan
          ref: d129840274f6a0faa1591a0ac3a5b92cc0bb5d88
          path: .source/terminan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e '.[test]'
      - name: Install canonical Math v1 for migrated runtime imports
        run: python -m pip install --no-deps -e .source/math
      - name: Install canonical Terminan 0.1 paper owner
        run: python -m pip install --no-deps -e .source/terminan
      - name: Reject unexpected Terminan paper source or runtime class
        shell: python
        run: |
          import importlib.metadata,pathlib,subprocess
          root=pathlib.Path('.source/terminan').resolve(strict=True)
          assert subprocess.check_output(['git','--no-replace-objects','-C',str(root),'rev-parse','HEAD'],text=True).strip()=='d129840274f6a0faa1591a0ac3a5b92cc0bb5d88'
          assert subprocess.check_output(['git','--no-replace-objects','-C',str(root),'rev-parse','HEAD:terminan/paper.py'],text=True).strip()=='a76ec2ea46b34a4d63d02b570b5a67e779daa5af'
          import terminan.paper
          assert importlib.metadata.version('unified-terminan')=='0.1.0'
          assert pathlib.Path(terminan.paper.__file__).resolve().is_relative_to(root)
          from meta_analyse.runtime import PaperEngine
          assert PaperEngine is terminan.paper.PaperEngine
      - name: Verify Math installed dependency and source
        shell: python
        run: |
          import importlib.metadata, pathlib, subprocess
          root=pathlib.Path('.source/math').resolve(strict=True)
          actual=subprocess.check_output(['git','--no-replace-objects','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert actual=='150910fff08c896f243fdf7e64ec18611420a4d2'
          assert importlib.metadata.version('unified-math-kernels')=='0.1.0'
          import market_profile_math,market_compute_api
          assert pathlib.Path(market_profile_math.__file__).resolve().is_relative_to(root)
          assert pathlib.Path(market_compute_api.__file__).resolve().is_relative_to(root)
      - run: python -m pip check
      - name: Verify exact PostgreSQL18.1 server
        run: python -c "import os,psycopg; c=psycopg.connect(os.environ['META_ANALYSE_TEST_ADMIN_DSN']); assert c.info.server_version==180001; c.close()"
      - name: Validate source syntax
        run: python -m compileall -q src tests
      - name: Run storage unit and PostgreSQL integration tests
        run: python -m pytest -q tests/test_storage_ingestion_unit.py tests/test_storage_ingestion_postgres.py tests/test_flow_history_storage.py --junitxml=storage-tests.xml
      - name: Reject missing, failed or skipped integration evidence
        run: python -c "import xml.etree.ElementTree as E; c=list(E.parse('storage-tests.xml').getroot().iter('testcase')); assert c and all(all(x.find(t) is None for t in ('skipped','error','failure')) for x in c)"
      - name: Project isolated public evidence
        id: privacy_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit storage-tests.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy_gate.outcome == 'success'
        with:
          name: storage-ingestion-exact-source
          if-no-files-found: error
          path: public-evidence/
