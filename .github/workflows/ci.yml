name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    if: ${{ !contains(fromJSON('["test/http-sys-encoding-20261026","fix/http-sys-format-20261026","fix/pr51-hosted-isolation-20261026","integration/adminit-security-readiness-20261025","integration/adminit-final-20261025","parallel/adminit-scm-correlation-20261025","parallel/adminit-r0-r5-liveness-20261025","parallel/adminit-r0-r5-adapter-20261025","parallel/adminit-minimal-refusal-20261025","parallel/adminit-kernel-identity-evidence","parallel/adminit-identity-integration-20261021","parallel/adminit-identity-acceptance-fix-20261022","parallel/adminit-pr20-security-fix-20261022","parallel/adminit-pr21-evidence-schema-20261022","parallel/adminit-pr22-boundary-review-20261022","parallel/adminit-pr23-output-transaction-20261023","maintenance/repository-ci-hygiene-20261023","maintenance/actions-audit-hardening-20261023","maintenance/pr27-content-review-20261023"]'), github.head_ref || github.ref_name) }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UNIFIED_SOURCE_ROOT: ${{ github.workspace }}/.source/unified-system
      QT_QPA_PLATFORM: offscreen
      PYTHONASYNCIODEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact owned Python bootstrap source
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/unified-system
          ref: d065537d880295282eb2a157579813958417407e
          path: .source/unified-system
          persist-credentials: false
      - name: Verify exact Unified bootstrap dependency
        shell: python
        run: |
          import os, pathlib, subprocess
          root=pathlib.Path(os.environ['UNIFIED_SOURCE_ROOT'])
          actual=subprocess.check_output(['git','--no-replace-objects','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert actual=='d065537d880295282eb2a157579813958417407e'
          assert (root/'unified_system/owned_python.py').is_file()
      - name: Verify exact Actions source SHA
        run: python scripts/record_ci_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[test,archive]"
      - run: python -m pip check
      - name: Mandatory diagnostic hardening regressions (synthetic evidence only)
        run: python -m pytest -q tests/test_diagnostic_hardening.py tests/test_process_inventory_identity.py tests/test_host_identity_authorization.py tests/test_windows_service_contracts.py --junitxml=diagnostic-tests.xml
      - name: Reject missing or skipped diagnostic cases
        run: python scripts/check_integration_junit.py diagnostic-tests.xml --minimum 169 --require-exact test_exact_refusal_predicate_remains_unresolved --require-exact test_dpapi_input_retains_evidence_for_replay_without_public_leak --require-exact test_no_elevation_blocks_before_powershell --require-exact test_candidate_binding_rejects_wrong_sha_dirty_and_untracked_collector --require-exact test_nonelevated_diagnose_emits_single_safe_failure --require-exact test_observation_contains_collector_binding_only_privately --require-exact test_collector_change_during_collection_blocks_observation --require-exact test_artifact_gate_rejects_raw_private_payload_without_echo --require-exact test_child_missing_elevation_is_not_trusted --require-exact test_private_evidence_real_dpapi_roundtrip_or_platform_refusal --require-exact test_complete_named_service_implementation_proof_can_verify --require-exact test_unproved_or_spoofed_service_implementation_stays_unresolved --require-exact test_native_format_and_kernel_label_never_authorize_error31 --require-exact test_combined_lsa_membership_requires_every_implementation
      - name: Real Windows read-only native process and SCM boundary
        shell: powershell
        run: ./commissioning/check-process-probe.ps1 -Output process-probe.json
      - name: Mandatory local HTTP archive fault regression (Windows)
        run: |
          python -m pip install -c requirements.lock aiohttp
          python -c "import aiohttp"
          python -m pytest -q tests/test_archive_http_server.py tests/test_archive_resumable_faults.py
      - name: Provision pinned PostgreSQL18 in disposable runner
        id: pg18
        shell: pwsh
        run: ./scripts/prepare-ci-postgres18.ps1
      - name: Windows Qt and disposable PostgreSQL integration
        shell: pwsh
        run: ./scripts/test-windows.ps1 -PgBin "${{ steps.pg18.outputs.pgbin }}"
      - name: Bounded native JUnit failure annotations
        if: always()
        shell: python
        run: |
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = [Path("diagnostic-tests.xml"), Path(os.environ["RUNNER_TEMP"]) / "meta-analyse-ci" / "tests.xml"]

          def safe(value, limit):
              text = re.sub(r"(?i)\bbearer\s+\S+", "Bearer [REDACTED]", str(value))
              text = re.sub(r"(?i)\b(?:[a-z][a-z0-9+.-]*://|www\.)[^\s<>\"']+", "[URL REDACTED]", text)
              text = re.sub(r"""(?i)\b[\w.-]*(?:password|passwd|pwd|token|secret|authorization)[\w.-]*['"]?\s*[:=]\s*(?:"[^"]*"|'[^']*'|[^\s,;]+)""", "[CREDENTIAL REDACTED]", text)
              text = re.sub(r"[\x00-\x09\x0b\x0c\x0e-\x1f\x7f-\x9f]", " ", text)[:limit]
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          shown = 0
          for path in reports:
              try:
                  with path.open("rb") as stream:
                      raw = stream.read(16 * 1024 * 1024 + 1)
                  if len(raw) > 16 * 1024 * 1024:
                      raise ValueError("size")
                  text = raw.decode("utf-8-sig")
                  if "\x00" in text or "<!doctype" in text.lower() or "<!entity" in text.lower():
                      raise ValueError("DTD/entity")
                  root = ET.fromstring(text)
              except FileNotFoundError:
                  continue
              except (OSError, UnicodeError, ValueError, ET.ParseError):
                  print("::error::Native JUnit diagnostics refused an unsafe or invalid report")
                  continue
              for case in root.iter("testcase"):
                  failure = next((child for child in case if child.tag in ("failure", "error")), None)
                  if failure is None or shown >= 10:
                      continue
                  identity = case.get("classname", "") + "." + case.get("name", "unknown")
                  print("::error::" + safe(identity, 200) + " | " + safe(failure.get("message", "No failure message"), 360))
                  shown += 1
      - name: Validate Windows platform receipt
        id: platform_receipt
        shell: pwsh
        run: |
          python scripts/platform_coverage.py receipt --xml "$env:RUNNER_TEMP/meta-analyse-ci/tests.xml" --manifest "$env:RUNNER_TEMP/meta-analyse-ci/full-identities.json" --ledger "$env:RUNNER_TEMP/meta-analyse-ci/platform-ledger.json" --output public-platform
          if ($LASTEXITCODE -ne 0) { throw 'Platform receipt rejected' }
          python scripts/platform_coverage.py validate public-platform
          if ($LASTEXITCODE -ne 0) { throw 'Platform staging rejected' }
      - uses: actions/upload-artifact@v4
        if: always() && steps.platform_receipt.outcome == 'success'
        with:
          name: platform-windows
          path: public-platform/
          if-no-files-found: error
      - name: Independently reject missing or skipped Windows storage and shutdown cases
        shell: pwsh
        run: python scripts/check_integration_postgres.py "$env:RUNNER_TEMP/meta-analyse-ci/tests.xml"
      - name: Measure synthetic 20-instrument UI load
        id: benchmark
        shell: pwsh
        run: python scripts/benchmark_flow_ui.py --seconds 3 --output "$env:RUNNER_TEMP/meta-analyse-ci/ui-performance.json"
      - name: Verify repeated installation
        shell: pwsh
        run: |
          ./install.ps1 -Python (Get-Command python).Source -InstallRoot "$env:RUNNER_TEMP\installer target"
          ./install.ps1 -Python (Get-Command python).Source -InstallRoot "$env:RUNNER_TEMP\installer target"
      - name: Verify tracked source before publication
        id: source_clean
        if: always()
        run: git diff --exit-code HEAD
      - name: Project isolated public evidence
        id: privacy_gate
        if: always() && steps.source_clean.outcome == 'success'
        shell: pwsh
        run: |
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit diagnostic-tests.xml --junit "$env:RUNNER_TEMP/meta-analyse-ci/tests.xml" --junit-glob "$env:RUNNER_TEMP/meta-analyse-ci/repeat-lifecycle/*/tests.xml" --postgres-version "$env:RUNNER_TEMP/meta-analyse-pg18/provenance.json"
          if ($LASTEXITCODE -ne 0) { throw 'Public projection blocked' }
          python scripts/project_public_ci_evidence.py --validate public-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Public inventory blocked' }
      - name: Project bounded UI benchmark evidence (including refusal)
        id: benchmark_projection
        if: ${{ always() && steps.source_clean.outcome == 'success' }}
        shell: pwsh
        run: python scripts/project_ui_benchmark.py --output public-benchmark --source source-sha.json --benchmark "$env:RUNNER_TEMP/meta-analyse-ci/ui-performance.json" --expected-outcome "${{ steps.benchmark.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.benchmark_projection.outcome == 'success'
        with:
          name: windows-ui-benchmark
          if-no-files-found: error
          path: public-benchmark/
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy_gate.outcome == 'success'
        with:
          name: windows-test-evidence
          if-no-files-found: error
          path: public-evidence/
  linux:
    if: ${{ !contains(fromJSON('["test/http-sys-encoding-20261026","fix/http-sys-format-20261026","fix/pr51-hosted-isolation-20261026","integration/adminit-security-readiness-20261025","integration/adminit-final-20261025","parallel/adminit-scm-correlation-20261025","parallel/adminit-r0-r5-liveness-20261025","parallel/adminit-r0-r5-adapter-20261025","parallel/adminit-minimal-refusal-20261025","parallel/adminit-kernel-identity-evidence","parallel/adminit-identity-integration-20261021","parallel/adminit-identity-acceptance-fix-20261022","parallel/adminit-pr20-security-fix-20261022","parallel/adminit-pr21-evidence-schema-20261022","parallel/adminit-pr22-boundary-review-20261022","parallel/adminit-pr23-output-transaction-20261023","maintenance/repository-ci-hygiene-20261023","maintenance/actions-audit-hardening-20261023","maintenance/pr27-content-review-20261023"]'), github.head_ref || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UNIFIED_SOURCE_ROOT: ${{ github.workspace }}/.source/unified-system
      QT_QPA_PLATFORM: offscreen
      PYTHONASYNCIODEBUG: '1'
      META_ANALYSE_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
      META_ANALYSE_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact owned Python bootstrap source
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/unified-system
          ref: d065537d880295282eb2a157579813958417407e
          path: .source/unified-system
          persist-credentials: false
      - name: Verify exact Unified bootstrap dependency
        shell: python
        run: |
          import os, pathlib, subprocess
          root=pathlib.Path(os.environ['UNIFIED_SOURCE_ROOT'])
          actual=subprocess.check_output(['git','--no-replace-objects','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert actual=='d065537d880295282eb2a157579813958417407e'
          assert (root/'unified_system/owned_python.py').is_file()
      - name: Verify exact Actions source SHA
        run: python scripts/record_ci_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -c requirements.lock -e ".[test,archive]"
      - run: python -m pip check
      - name: Mandatory diagnostic hardening regressions (synthetic evidence only)
        run: python -m pytest -q tests/test_diagnostic_hardening.py tests/test_process_inventory_identity.py tests/test_host_identity_authorization.py tests/test_windows_service_contracts.py --junitxml=diagnostic-tests.xml
      - name: Reject missing or skipped diagnostic cases
        run: python scripts/check_integration_junit.py diagnostic-tests.xml --minimum 169 --require-exact test_exact_refusal_predicate_remains_unresolved --require-exact test_dpapi_input_retains_evidence_for_replay_without_public_leak --require-exact test_no_elevation_blocks_before_powershell --require-exact test_candidate_binding_rejects_wrong_sha_dirty_and_untracked_collector --require-exact test_nonelevated_diagnose_emits_single_safe_failure --require-exact test_observation_contains_collector_binding_only_privately --require-exact test_collector_change_during_collection_blocks_observation --require-exact test_artifact_gate_rejects_raw_private_payload_without_echo --require-exact test_child_missing_elevation_is_not_trusted --require-exact test_private_evidence_real_dpapi_roundtrip_or_platform_refusal --require-exact test_complete_named_service_implementation_proof_can_verify --require-exact test_unproved_or_spoofed_service_implementation_stays_unresolved --require-exact test_native_format_and_kernel_label_never_authorize_error31 --require-exact test_combined_lsa_membership_requires_every_implementation
      - name: Confirm PostgreSQL18 server
        run: python -c "import os,psycopg,json; c=psycopg.connect(os.environ['META_ANALYSE_TEST_ADMIN_DSN']); v=c.info.server_version; assert v==180001; open('postgres-version.json','w').write(json.dumps({'server_version':v})); c.close()"
      - run: python -m compileall -q src
      - name: Repeat lifecycle resource regressions in fresh processes
        run: python scripts/repeat_lifecycle_tests.py --runs 10 --output-dir repeat-lifecycle
      - name: Mandatory local HTTP archive fault regression (Linux)
        run: |
          python -m pip install -c requirements.lock aiohttp
          python -c "import aiohttp"
          python -m pytest -q tests/test_archive_http_server.py tests/test_archive_resumable_faults.py
      - name: Linux regressions (preserve pytest failure through tee)
        shell: bash
        env:
          META_ANALYSE_CI_IDENTITY_SCOPE: full
          META_ANALYSE_PLATFORM_SUITE: main
          META_ANALYSE_PLATFORM_LEDGER: ${{ runner.temp }}/platform-ledger.json
          META_ANALYSE_SYNTHETIC_IDENTITIES: ${{ runner.temp }}/full-identities.json
        run: |
          set -o pipefail
          python -m pytest -q -p scripts.ci_identity_manifest -p scripts.ci_platform_coverage --ignore=tests/test_pg18_disposable_acceptance.py -W error::RuntimeWarning --junitxml=tests.xml | tee tests.log
          python scripts/check_final_integration_junit.py "$(pwd)/tests.xml" "${{ runner.temp }}/full-identities.json"
      - name: Validate Linux platform receipt
        id: platform_receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/platform_coverage.py receipt --xml tests.xml --manifest "${{ runner.temp }}/full-identities.json" --ledger "${{ runner.temp }}/platform-ledger.json" --output public-platform
          python scripts/platform_coverage.py validate public-platform
      - uses: actions/upload-artifact@v4
        if: always() && steps.platform_receipt.outcome == 'success'
        with:
          name: platform-linux
          path: public-platform/
          if-no-files-found: error
      - name: Verify eleven PostgreSQL and five shutdown integration cases executed without skips
        run: python scripts/check_integration_postgres.py tests.xml --allow-skip test_failed_pip_install_never_reports_success_or_creates_launcher
      - name: Measure synthetic 20-instrument UI load
        id: benchmark
        run: python scripts/benchmark_flow_ui.py --seconds 3 --output ui-performance.json
      - name: Verify tracked source before publication
        id: source_clean
        if: always()
        run: git diff --exit-code HEAD
      - name: Project isolated public evidence
        id: privacy_gate
        if: always() && steps.source_clean.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit diagnostic-tests.xml --junit tests.xml --junit-glob "repeat-lifecycle/*/tests.xml" --postgres-version postgres-version.json
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - name: Project bounded UI benchmark evidence (including refusal)
        id: benchmark_projection
        if: ${{ always() && steps.source_clean.outcome == 'success' }}
        shell: bash
        run: python scripts/project_ui_benchmark.py --output public-benchmark --source source-sha.json --benchmark ui-performance.json --expected-outcome "${{ steps.benchmark.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.benchmark_projection.outcome == 'success'
        with:
          name: linux-ui-benchmark
          if-no-files-found: error
          path: public-benchmark/
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy_gate.outcome == 'success'
        with:
          name: linux-test-evidence
          if-no-files-found: error
          path: public-evidence/

  archive-pinned-contract:
    if: ${{ !contains(fromJSON('["test/http-sys-encoding-20261026","fix/http-sys-format-20261026","fix/pr51-hosted-isolation-20261026","integration/adminit-security-readiness-20261025","integration/adminit-final-20261025","parallel/adminit-scm-correlation-20261025","parallel/adminit-r0-r5-liveness-20261025","parallel/adminit-r0-r5-adapter-20261025","parallel/adminit-minimal-refusal-20261025","parallel/adminit-kernel-identity-evidence","parallel/adminit-identity-integration-20261021","parallel/adminit-identity-acceptance-fix-20261022","parallel/adminit-pr20-security-fix-20261022","parallel/adminit-pr21-evidence-schema-20261022","parallel/adminit-pr22-boundary-review-20261022","parallel/adminit-pr23-output-transaction-20261023","maintenance/repository-ci-hygiene-20261023","maintenance/actions-audit-hardening-20261023","maintenance/pr27-content-review-20261023"]'), github.head_ref || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact archive source SHA
        run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock -e '.[test,archive]'
      - run: python -m pytest tests/test_archive_http_server.py tests/test_archive_resumable_faults.py -q --junitxml=archive-contract.xml
      - name: Reject archive skips and empty report
        run: python -c "import xml.etree.ElementTree as E; c=list(E.parse('archive-contract.xml').getroot().iter('testcase')); assert c and all(all(x.find(t) is None for t in ('skipped','error','failure')) for x in c)"
      - name: Verify tracked source before publication
        id: source_clean
        if: always()
        run: git diff --exit-code HEAD
      - name: Project isolated public evidence
        id: privacy_gate
        if: always() && steps.source_clean.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_public_ci_evidence.py --output public-evidence --source source-sha.json --junit archive-contract.xml
          python scripts/project_public_ci_evidence.py --validate public-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy_gate.outcome == 'success'
        with:
          name: archive-pinned-contract-evidence
          if-no-files-found: error
          path: public-evidence/

  platform-coverage:
    needs: [linux, windows]
    if: ${{ always() && (needs.linux.result != 'skipped' || needs.windows.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require both actual lanes
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: python -c "import os; assert os.environ['LINUX_RESULT']=='success' and os.environ['WINDOWS_RESULT']=='success'"
      - uses: actions/download-artifact@v4
        with:
          name: platform-linux
          path: platform-linux
      - uses: actions/download-artifact@v4
        with:
          name: platform-windows
          path: platform-windows
      - name: Require exact same-source portable and Windows coverage
        run: python scripts/platform_coverage.py aggregate --linux platform-linux --windows platform-windows --suite main
