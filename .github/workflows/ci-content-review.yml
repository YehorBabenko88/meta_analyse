name: CI content security synthetic
on:
  push:
    branches: ['maintenance/pr27-content-review-20261023']
  pull_request:
    paths:
      - 'scripts/verify_ci_audit_artifact_contents.py'
      - 'tests/test_ci_audit_artifact_contents.py'
      - 'tests/test_ci_audit_content_security.py'
      - '.github/workflows/ci-content-review.yml'
permissions:
  contents: read
concurrency:
  group: ci-content-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  content:
    if: (github.head_ref || github.ref_name) == 'maintenance/pr27-content-review-20261023'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_ci_source.py
      - run: python -m pip install -c requirements.lock pytest
      - name: Original and adversarial content cases only
        run: python -m pytest --noconftest -q tests/test_ci_audit_artifact_contents.py tests/test_ci_audit_content_security.py --junitxml=content-tests.xml
      - name: Strict public projection and privacy
        id: privacy
        if: always()
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); import project_synthetic_artifacts as p; p.project_junit(Path('content-tests.xml')); p.validate_source(Path('source-sha.json'))"
          python scripts/check_public_diagnostic_artifacts.py content-tests.xml source-sha.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: content-security-${{ matrix.os }}
          if-no-files-found: error
          path: |
            content-tests.xml
            source-sha.json
